<section class="creator" aria-label="直接创作">
  <header class="creator-head"><div><h2>选好题，直接做</h2><p>从热榜点选，也可以直接输入自己的想法。</p></div><span id="creator-model" class="creator-status">正在读取设置…</span></header>
  <fieldset id="creator-ready" disabled style="border:0;padding:0;margin:0;min-width:0"><nav class="creator-tabs" aria-label="选题方式"><button data-creator-tab="manual" aria-pressed="true">我有选题</button><button data-creator-tab="hot" aria-pressed="false">热榜选题</button></nav>
  <div id="creator-board" class="creator-board" hidden><div class="board-controls" id="board-categories"></div><div class="actions"><button id="board-refresh">刷新全部来源</button><a href="https://github.com/JackyST0/hotpush" target="_blank" rel="noopener">热点来自 HotPush ↗</a></div><p id="board-state" class="creator-source-note"></p><details class="creator-materials"><summary>HotPush 服务设置</summary><label for="hotpush-base">聚合服务地址（默认使用项目公开服务，也可换成自建服务）</label><input id="hotpush-base" type="url" style="width:100%" placeholder="https://hotpush.dawenzaist.de5.net"><button id="hotpush-save">保存并读取</button></details><div class="board-columns" id="board-columns"></div></div>
  <div class="creator-compose" id="creator-compose"><label for="creator-topic" class="hint">这一篇要做什么</label><textarea id="creator-topic" class="creator-topic" maxlength="300" rows="2" placeholder="例如：上个月 GitHub 热门 Skill TOP10，做成精致排行榜，1～2页讲完。"></textarea>
    <div class="creator-options"><fieldset><legend>信息密度</legend><label><input type="radio" name="creator-density" value="short">精简</label><label><input type="radio" name="creator-density" value="balanced" checked>均衡</label><label><input type="radio" name="creator-density" value="detailed">详细</label></fieldset>
    <fieldset><legend>表达风格</legend><label><input type="radio" name="creator-style" value="clean" checked>简洁精致</label><label><input type="radio" name="creator-style" value="lively">活跃生动</label><label><input type="radio" name="creator-style" value="professional">专业克制</label></fieldset>
    <fieldset><legend>篇幅（封面计入）</legend><select id="creator-pages" aria-label="内容页数"><option value="">自动</option><option value="1">1页</option><option value="2" selected>2页</option><option value="3">3页</option><option value="4">4页</option><option value="6">6页</option></select></fieldset></div>
    <div class="creator-recipe"><label for="creator-direction">题材方向</label><select id="creator-direction" aria-describedby="creator-skill-note"><option value="auto">自动识别</option></select><p class="hint" id="creator-skill-note">对应题材技能负责调研口径、内容组织与审核。</p><h3>想做成什么样</h3><div id="creator-templates" class="creator-template-grid" role="group" aria-label="内容模板"></div><a class="hint" href="/views/SkillWorkflow.html">查看或修改各环节的技能要求 →</a></div>
    <details class="creator-materials"><summary>再补充一句要求，或提供资料与配图（选填）</summary><label for="creator-requirements">补充要求</label><textarea id="creator-requirements" maxlength="3000" rows="2" placeholder="例如：不要安装教程，10个仓库必须全部列出，每项一句话说明。"></textarea><label for="creator-materials">参考资料（请保留来源）</label><textarea id="creator-materials" maxlength="16000" rows="3" placeholder="有自己的榜单、统计快照或原始资料，可以粘贴在这里。"></textarea><label for="creator-images">自有配图（最多6张）</label><input id="creator-images" type="file" accept="image/png,image/jpeg" multiple><div class="actions creator-upload" id="creator-upload"></div><fieldset style="margin-top:14px;border:0;padding:0"><legend>生成平台</legend><label><input type="checkbox" name="creator-platform" value="douyin" checked>抖音</label><label><input type="checkbox" name="creator-platform" value="xiaohongshu" checked>小红书</label></fieldset></details>
    <div class="creator-bottom"><div><div id="creator-contract" class="creator-contract"></div><p id="creator-call-note" class="creator-source-note"></p></div><button class="primary" id="creator-start">开始制作 →</button></div><div class="creator-error" id="creator-error" role="alert"></div>
  </div><div class="creator-task" id="creator-task" hidden aria-live="polite"><h3 id="creator-task-title"></h3><p id="creator-task-note"></p><div id="creator-task-stages"></div><div class="actions"><a class="btn primary" id="creator-preview" hidden>预览与继续调整 →</a><a class="btn" href="/views/Attention.html">查看任务问题</a><button id="creator-new">开始另一篇</button></div></div>

</fieldset></section>
