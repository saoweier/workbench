<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>样式与模板 Skill · 内容工作台</title><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/workbench.css?v=20261008-insecure1"><link rel="stylesheet" href="/assets/template-library.css?v=20261006"></head>
<body><nav class="nav" id="nav"></nav><main class="wrap"><header class="template-hero"><span class="chip">样式工坊</span><h1>一套规则，一种稳定的表达</h1><p class="hint">选样式，就是选写作 Skill 和配套版式。改规则、调外观，或复制一套搭建新模板。</p><div class="actions"><a class="btn primary" href="/views/Production.html?step=1">去创作室选样式</a><a class="btn" href="/views/SkillWorkflow.html">流程技能与内容诊断</a></div></header>
<div id="template-message" role="status" aria-live="polite"></div><div class="template-workspace"><aside><h2>我的样式</h2><div id="package-list" class="package-list"></div></aside>
<section class="package-editor" id="package-editor" hidden><form id="template-form"><div class="package-editor-head"><div><h2 id="editor-title">编辑样式</h2><small id="current-version"></small></div><button type="button" id="duplicate-template">复制为新模板</button></div>
<div class="package-meta"><label>样式名称<input id="template-name" required maxlength="36"></label><label>适合什么内容<input id="template-description" required maxlength="200"></label></div>
<label>写作 Skill<textarea id="template-instructions" required minlength="20" maxlength="8000" rows="10"></textarea></label><p class="hint">这里改“写哪些信息、怎么组织、哪些内容必须保留”。事实核验、页数、批准与发布规则由系统单独执行。</p>
<fieldset><legend>配套模板外观</legend><div id="style-colors" class="style-controls"></div><div id="style-sizes" class="style-controls"></div><div id="style-art" class="style-controls"></div></fieldset>
<div class="actions"><button type="submit" class="primary" id="save-template">保存规则与模板</button><button type="button" id="preview-template">预览固定示例</button><a class="btn" id="export-template">下载 Skill 与模板包</a></div>
<label class="history-label">历史版本 / 恢复内置<select id="template-history"><option value="">选择版本，载入编辑器</option></select></label><p class="hint" id="edit-notice">保存用于新任务；已有作品和在途任务继续使用其冻结版本。示例预览只检查排版，不调用模型。</p></form></section>
<section class="package-preview"><h2>看清每种视觉风格</h2><p class="hint">风格不限定题型。切换“同题对照”，用相同内容比较布局、字体和图案。</p><label>预览内容<select id="preview-mode"><option value="common">同题对照 · 四个 AI 概念</option><option value="representative">代表样例 · 讲解 / 对照 / 流程 / 清单</option></select></label><div class="preview-window"><iframe id="template-preview" title="模板排版示例" sandbox="allow-scripts"></iframe></div></section></div></main><script type="module" src="/assets/template-library.js?v=20261008-insecure1"></script></body></html>
